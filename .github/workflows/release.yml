name: Release

# Every push to main publishes the app as the "nightly" pre-release (replaced each time).
# Pushing a tag such as v0.2.0 publishes a versioned release.
on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Check translations
        run: swift scripts/l10n.swift check

      - name: Build the app
        run: |
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then export SUMI_VERSION="${GITHUB_REF_NAME#v}"; fi
          export SUMI_BUILD="$GITHUB_RUN_NUMBER"
          scripts/build-app.sh
          for arch in arm64 x86_64; do lipo build/Sumi.app/Contents/MacOS/Sumi -verify_arch "$arch"; done
          ditto -c -k --keepParent build/Sumi.app Sumi.zip

      - name: Publish nightly
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly Sumi.zip --prerelease --target "$GITHUB_SHA" \
            --title "Nightly build" \
            --notes "Latest build of main (${GITHUB_SHA:0:7}). Rebuilt on every push."

      - name: Publish release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" Sumi.zip --title "Sumi ${GITHUB_REF_NAME#v}" --generate-notes
