name: Translation
description: Report a wrong or missing translation, or ask for a new language
labels: [translation]
body:
  - type: input
    id: language
    attributes:
      label: Language
      placeholder: e.g. ja, pt-BR, zh-Hant
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What should change
      description: The English text, the current translation and the better one. You can also edit Localization/<language>.lproj/Localizable.strings on GitHub and open a pull request directly.
    validations:
      required: true
